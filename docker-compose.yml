services:
  fastapi-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ai_uploads:/app/data/uploads
      - ai_output:/app/data/output
    restart: unless-stopped
    networks:
      - poki-net

volumes:
  ai_uploads:
  ai_output:

networks:
  poki-net:
    external: true
