name: Deploy AI Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cleanup_port_8000() {
              sudo fuser -k 8000/tcp || true
              docker ps -a --filter "publish=8000" -q | xargs -r docker rm -f || true
              sudo lsof -tiTCP:8000 -sTCP:LISTEN | xargs -r sudo kill -9 || true
            }

            wait_for_port_8000() {
              for _ in $(seq 1 10); do
                if ! sudo lsof -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1; then
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            cleanup_port_8000
            docker network create poki-net || true
            cd ~/Pitchcoach-AI
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose config -q
            docker compose down --remove-orphans || true
            cleanup_port_8000
            if ! wait_for_port_8000; then
              echo "Port 8000 is still in use after cleanup."
              sudo lsof -iTCP:8000 -sTCP:LISTEN || true
              docker ps -a --filter "publish=8000" || true
              exit 1
            fi
            docker compose up -d --build
            # NestJS 컨테이너 네트워크에 AI 컨테이너 연결 (이미 연결된 경우 무시)
            docker network connect --alias fastapi-ai ec2-user_default $(docker compose ps -q fastapi-ai) 2>/dev/null || true
